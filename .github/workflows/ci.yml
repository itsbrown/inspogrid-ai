name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install root dependencies (Playwright)
        working-directory: .
        run: npm ci

      - name: Install Playwright browsers
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: E2E UC-09 (demo mode — no Supabase env in CI)
        working-directory: .
        run: npx playwright test tests/uc-09-manual-upload.spec.ts tests/uc-09-supabase-flow.spec.ts