<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        font-family: system-ui, sans-serif;
        padding: 16px;
        margin: 0;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        color: #57534e;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 10px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 8px;
        background: #e11d48;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>InspoGrid AI</h1>
    <p>Open a Pinterest board and click "Send to InspoGrid" on the page.</p>
    <label>App URL</label>
    <input id="apiUrl" type="url" placeholder="http://localhost:3000" />
    <label>Extension API Key</label>
    <input id="extensionKey" type="text" placeholder="dev-extension-key..." />
    <button id="save">Save settings</button>
    <script src="popup.js"></script>
  </body>
</html>
